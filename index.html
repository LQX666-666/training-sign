<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训报名系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2d3748;
        }
        h3 {
            margin-bottom: 15px;
            color: #444;
        }
        .form-box {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: inline-block;
            width: 110px;
            font-weight: bold;
            vertical-align: top;
            padding-top: 8px;
        }
        input, select, textarea {
            width: 340px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: none;
            min-height: 45px;
        }
        button {
            background: #2d8cf0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #1b74d0;
        }
        .export-btn {
            background: #00b42a;
        }
        .export-btn:hover {
            background: #009a23;
        }
        .info-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .record-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        .record-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            line-height: 1.6;
        }
        .hide {
            display: none !important;
        }
        .tip {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .admin-login {
            background: #fce4ec;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>培训报名系统（云端统一版）</h1>

    <div class="admin-login" id="adminLogin">
        <h3>管理员登录</h3>
        <div class="form-item">
            <label>账号：</label>
            <input type="text" id="adminUser" placeholder="输入管理员账号">
        </div>
        <div class="form-item">
            <label>密码：</label>
            <input type="password" id="adminPwd" placeholder="输入管理员密码">
        </div>
        <button id="loginBtn">登录</button>
    </div>

    <div class="form-box">
        <h3>报名信息填写</h3>
        <div class="form-item">
            <label>姓名：</label>
            <input type="text" id="name" placeholder="请输入真实姓名">
        </div>
        <div class="form-item">
            <label>性别：</label>
            <select id="gender">
                <option value="">请选择性别</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-item">
            <label>手机号：</label>
            <input type="tel" id="phone" placeholder="必填11位纯数字手机号" maxlength="11">
        </div>
        <div class="form-item">
            <label>毕业院校：</label>
            <input type="text" id="school" placeholder="仅可填写中文院校名称">
        </div>
        <!--新增学历下拉框-->
        <div class="form-item">
            <label>学历：</label>
            <select id="education">
                <option value="">请选择学历</option>
                <option value="硕士">硕士</option>
                <option value="本科/预备技师">本科/预备技师</option>
                <option value="大专/高技">大专/高技</option>
            </select>
        </div>
        <!--已删除细分专业，只保留三大类-->
        <div class="form-item">
            <label>专业大类：</label>
            <select id="majorType">
                <option value="">请选择专业大类</option>
                <option value="机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)">机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)</option>
                <option value="电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)">电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)</option>
                <option value="视觉大类(视觉，视觉算法)">视觉大类(视觉，视觉算法)</option>
            </select>
        </div>
        <div class="form-item">
            <label>培训日期：</label>
            <select id="trainDate">
                <option value="">请选择培训日期</option>
                <option value="6月25日">6月25日</option>
                <option value="7月2日">7月2日</option>
                <option value="7月9日">7月9日</option>
                <option value="7月16日">7月16日</option>
                <option value="7月23日">7月23日</option>
                <option value="7月30日">7月30日</option>
            </select>
        </div>
        <div class="form-item">
            <label>穿衣尺码：</label>
            <select id="clothesSize">
                <option value="">请选择尺码</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
                <option value="3XL">3XL</option>
                <option value="4XL">4XL</option>
                <option value="其他">其他</option>
            </select>
            <div id="otherSizeBox" class="hide">
                <textarea id="otherSize" placeholder="请填写其他尺码"></textarea>
            </div>
        </div>
        <div class="form-item">
            <label>穿鞋码数：</label>
            <textarea id="shoeSize" placeholder="例：42、38、36等"></textarea>
        </div>
        <button id="submit">提交报名</button>
        <button id="exportExcel" class="export-btn hide">导出 Excel 报名表</button>
    </div>

    <div class="info-box hide" id="countBox">
        <h3>实时报名人数</h3>
        <div id="countInfo"></div>
    </div>

    <div class="info-box hide" id="recordBox">
        <h3>已报名名单</h3>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<script>
const API_URL = "https://api.jsonbin.io/v3/b/6651f1c2ad37e9467cc781f1";
const API_KEY = "$2b$10$LjzUCR5oFd7d5v5h5e5e5e";

// 三大类配置、限额：机械35、电气35、视觉10，单日总上限90
const majorLimit = {
    "机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)":35,
    "电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)":35,
    "视觉大类(视觉，视觉算法)":10
};
const dates = ["6月25日","7月2日","7月9日","7月16日","7月23日","7月30日"];

let countData = {};
dates.forEach(d => {
    countData[d] = {
        total:0,
        "机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)":0,
        "电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)":0,
        "视觉大类(视觉，视觉算法)":0
    };
});

let records = [];
let isAdmin = false;

async function loadCloudData() {
    let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } });
    let data = await res.json();
    records = data.record.records || [];
    countData = data.record.countData || countData;
    refresh();
}

async function saveCloudData() {
    await fetch(API_URL, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ records, countData })
    });
}

window.onload = async () => {
    await loadCloudData();
    bindEvent();
    refresh();
};

function bindEvent() {
    document.getElementById('clothesSize').onchange = function() {
        document.getElementById('otherSizeBox').classList.toggle('hide', this.value !== '其他');
    };

    document.getElementById('loginBtn').onclick = () => {
        const user = document.getElementById('adminUser').value;
        const pwd = document.getElementById('adminPwd').value;
        if(user === 'lqx666' && pwd === 'lqx888'){
            isAdmin = true;
            document.getElementById('adminLogin').classList.add('hide');
            document.getElementById('exportExcel').classList.remove('hide');
            document.getElementById('countBox').classList.remove('hide');
            document.getElementById('recordBox').classList.remove('hide');
            alert('管理员登录成功！');
            refresh();
        }else{
            alert('账号或密码错误！');
        }
    };
}

function refresh() {
    if(!isAdmin) return;
    let html = '';
    dates.forEach(d => {
        const item = countData[d];
        html += `<p>${d}：总${item.total}/90 | ${Object.keys(majorLimit)[0]}：${item[Object.keys(majorLimit)[0]]}/${majorLimit[Object.keys(majorLimit)[0]]} | ${Object.keys(majorLimit)[1]}：${item[Object.keys(majorLimit)[1]]}/${majorLimit[Object.keys(majorLimit)[1]]} | ${Object.keys(majorLimit)[2]}：${item[Object.keys(majorLimit)[2]]}/${majorLimit[Object.keys(majorLimit)[2]]}</p>`;
    });
    document.getElementById('countInfo').innerHTML = html;

    let rhtml = '';
    records.forEach((item, i) => {
        rhtml += `
        <div class="record-item">
            ${i+1}、${item.name} | ${item.gender} | ${item.phone} | 学历：${item.education}<br>
            院校：${item.school} | 专业：${item.majorType}<br>
            日期：${item.trainDate} | 衣服：${item.clothesSize} ${item.otherSize||''} | 鞋码：${item.shoeSize}
        </div>`;
    });
    document.getElementById('recordList').innerHTML = rhtml || '<p>暂无报名</p>';
}

document.getElementById('submit').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const gender = document.getElementById('gender').value;
    const phone = document.getElementById('phone').value.trim();
    const school = document.getElementById('school').value.trim();
    const education = document.getElementById('education').value;
    const majorType = document.getElementById('majorType').value;
    const trainDate = document.getElementById('trainDate').value;
    const clothesSize = document.getElementById('clothesSize').value;
    const otherSize = document.getElementById('otherSize').value.trim();
    const shoeSize = document.getElementById('shoeSize').value.trim();

    //空校验
    if(!name||!gender||!phone||!school||!education||!majorType||!trainDate||!clothesSize||!shoeSize){
        alert('请填写完整信息！'); return;
    }
    if(clothesSize === '其他' && !otherSize){
        alert('请填写其他尺码！'); return;
    }

    //手机号11位纯数字
    const regPhone = /^\d{11}$/;
    if(!regPhone.test(phone)){
        alert('手机号格式错误！必须填写11位纯数字！');
        return;
    }
    //院校全中文
    const regChinese = /^[\u4e00-\u9fa5]+$/;
    if(!regChinese.test(school)){
        alert('毕业院校只能填写中文，不可填写数字、英文、符号！');
        return;
    }
    //姓名+手机号防重复
    if(records.some(i => i.name === name && i.phone === phone)){
        alert('该学生已报名，禁止重复提交！'); return;
    }

    const day = countData[trainDate];
    //单日总人数上限90
    if(day.total >= 90){
        alert(trainDate+'总报名人数已满90人！'); return;
    }
    //大类单独限额
    if(day[majorType] >= majorLimit[majorType]){
        alert(`${trainDate}${majorType}名额已满${majorLimit[majorType]}人！`);
        return;
    }

    day.total++;
    day[majorType]++;
    records.push({name,gender,phone,school,education,majorType,trainDate,clothesSize,otherSize,shoeSize});
    await saveCloudData();
    alert('报名成功！');
    document.querySelectorAll('input,select,textarea').forEach(e=>e.value='');
    document.getElementById('otherSizeBox').classList.add('hide');
};

//导出Excel（新增学历列）
document.getElementById('exportExcel').onclick = function() {
    if (!isAdmin) { alert("仅管理员可导出"); return; }
    if (records.length === 0) { alert("暂无数据"); return; }
    let csv = "姓名,性别,手机号,毕业院校,学历,专业大类,培训日期,穿衣尺码,其他尺码,穿鞋码数\n";
    records.forEach(item => {
        csv += `${item.name},${item.gender},${item.phone},${item.school},${item.education},${item.majorType},${item.trainDate},${item.clothesSize},${item.otherSize || ""},${item.shoeSize}\n`;
    });
    const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "培训报名名单.csv";
    a.click();
    URL.revokeObjectURL(url);
};
</script>
</body>
</html>
