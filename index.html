<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训报名系统（按钮修复+全同步）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2d3748;
        }
        h3 {
            margin-bottom: 15px;
            color: #444;
        }
        .form-box {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: inline-block;
            width: 110px;
            font-weight: bold;
            vertical-align: top;
            padding-top: 8px;
        }
        input, select, textarea {
            width: 340px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: none;
            min-height: 45px;
        }
        button {
            background: #2d8cf0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:disabled{
            background:#999;
            cursor:not-allowed;
        }
        button:hover:not(:disabled) {
            background: #1b74d0;
        }
        .export-btn {
            background: #00b42a;
        }
        .refresh-data-btn{
            background:#ff7d00;
        }
        .logout-btn{
            background:#dc3545;
        }
        .info-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .record-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        .record-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            line-height: 1.6;
        }
        .hide {
            display: none !important;
        }
        .admin-login {
            background: #fce4ec;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .admin-operate{
            margin:15px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>培训报名系统（全同步修复版）</h1>

    <div class="admin-login" id="adminLogin">
        <h3>管理员登录</h3>
        <div class="form-item">
            <label>账号：</label>
            <input type="text" id="adminUser" placeholder="输入管理员账号">
        </div>
        <div class="form-item">
            <label>密码：</label>
            <input type="password" id="adminPwd" placeholder="输入管理员密码">
        </div>
        <button id="loginBtn">登录</button>
    </div>

    <div class="admin-operate hide" id="adminOperBox">
        <button id="refreshData" class="refresh-data-btn">强制刷新最新数据</button>
        <button id="exportExcel" class="export-btn">导出 Excel 报名表</button>
        <button id="logoutBtn" class="logout-btn">退出管理员登录</button>
    </div>

    <div class="form-box">
        <h3>报名信息填写</h3>
        <div class="form-item">
            <label>姓名：</label>
            <input type="text" id="name" placeholder="请输入真实姓名">
        </div>
        <div class="form-item">
            <label>性别：</label>
            <select id="gender">
                <option value="">请选择性别</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-item">
            <label>手机号：</label>
            <input type="tel" id="phone" placeholder="必填11位纯数字手机号" maxlength="11">
        </div>
        <div class="form-item">
            <label>毕业院校：</label>
            <input type="text" id="school" placeholder="仅可填写中文院校名称">
        </div>
        <div class="form-item">
            <label>学历：</label>
            <select id="education">
                <option value="">请选择学历</option>
                <option value="硕士">硕士</option>
                <option value="本科/预备技师">本科/预备技师</option>
                <option value="大专/高技">大专/高技</option>
            </select>
        </div>
        <div class="form-item">
            <label>岗位大类：</label>
            <select id="postType">
                <option value="">请选择岗位大类</option>
                <option value="机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)">机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)</option>
                <option value="电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)">电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)</option>
                <option value="视觉大类(视觉，视觉算法)">视觉大类(视觉，视觉算法)</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-item hide" id="otherRemarkBox">
            <label>岗位备注：</label>
            <textarea id="postRemark" placeholder="自行填写所属岗位信息"></textarea>
        </div>
        <div class="form-item">
            <label>培训日期：</label>
            <select id="trainDate">
                <option value="">请选择培训日期</option>
                <option value="6月25日">6月25日</option>
                <option value="7月2日">7月2日</option>
                <option value="7月9日">7月9日</option>
                <option value="7月16日">7月16日</option>
                <option value="7月23日">7月23日</option>
                <option value="7月30日">7月30日</option>
            </select>
        </div>
        <div class="form-item">
            <label>穿衣尺码：</label>
            <select id="clothesSize">
                <option value="">请选择尺码</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
                <option value="3XL">3XL</option>
                <option value="4XL">4XL</option>
                <option value="其他">其他</option>
            </select>
            <div id="otherSizeBox" class="hide">
                <textarea id="otherSize" placeholder="请填写其他尺码"></textarea>
            </div>
        </div>
        <div class="form-item">
            <label>穿鞋码数：</label>
            <textarea id="shoeSize" placeholder="例：42、38、36等"></textarea>
        </div>
        <button id="submit">提交报名</button>
    </div>

    <div class="info-box hide" id="countBox">
        <h3>实时报名人数</h3>
        <div id="countInfo"></div>
    </div>

    <div class="info-box hide" id="recordBox">
        <h3>已报名名单</h3>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<script>
const BIN_ID = "685d8991ad37e97734cc9178";
const API_KEY = "$2b$10$3ZPuYdFzrO2dN0X0wO9Hvep1LzR6jK0lV8g9jX7xQn8R0lX7yX0y";

const postLimit = {
    "机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)":35,
    "电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)":35,
    "视觉大类(视觉，视觉算法)":10
};
const dates = ["6月25日","7月2日","7月9日","7月16日","7月23日","7月30日"];

let countData = {};
dates.forEach(d => {
    countData[d] = { total:0, ...Object.fromEntries(Object.keys(postLimit).map(k=>[k,0])) };
});

let records = [];
let isAdmin = false;
let refreshBtn = null;

// 防缓存地址
function getNoCacheUrl(){
    let t = new Date().getTime() + Math.random();
    return `https://api.jsonbin.io/v3/b/${BIN_ID}/latest?_=${t}`;
}

// 核心刷新函数：增加按钮禁用、超时、报错弹窗
async function loadCloudData() {
    refreshBtn = document.getElementById('refreshData');
    if(refreshBtn) refreshBtn.disabled = true;
    try {
        // 10秒超时控制，防止请求卡死
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(),10000);
        const res = await fetch(getNoCacheUrl(), {
            headers: { "X-Master-Key": API_KEY },
            cache: "no-cache",
            credentials: "omit",
            signal:controller.signal
        });
        clearTimeout(timer);
        const json = await res.json();
        if(json?.record){
            records = Array.isArray(json.record.records) ? [...json.record.records] : [];
            countData = json.record.countData || countData;
        }
        refresh();
        alert("数据刷新成功！");
    } catch (err) {
        console.error(err);
        alert("刷新失败："+err.message+"\n检查网络或稍后重试");
    } finally {
        if(refreshBtn) refreshBtn.disabled = false;
    }
}

// 提交：先拉云端再新增，杜绝丢数据
async function saveCloudData(newItem,dayKey,typeKey){
    await loadCloudData();
    let day = countData[dayKey];
    day.total++;
    if(typeKey !== "其他") day[typeKey]++;
    records.push(newItem);
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY,
            "Cache-Control":"no-cache"
        },
        body: JSON.stringify({ records, countData })
    });
}

// DOM加载完成再绑定事件（根治绑定失效）
document.addEventListener('DOMContentLoaded',async ()=>{
    const localLogin = localStorage.getItem('adminLoginStatus');
    if(localLogin === 'ok'){
        isAdmin = true;
        setAdminShow();
    }
    await loadCloudData();
    // 7秒自动轮询
    setInterval(loadCloudData,7000);
    bindEvent();
})

function setAdminShow(){
    document.getElementById('adminLogin').classList.add('hide');
    document.getElementById('adminOperBox').classList.remove('hide');
    document.getElementById('countBox').classList.remove('hide');
    document.getElementById('recordBox').classList.remove('hide');
}

// addEventListener稳定绑定，替换onclick
function bindEvent(){
    //登录按钮
    document.getElementById('loginBtn').addEventListener('click',async ()=>{
        const user = document.getElementById('adminUser').value.trim();
        const pwd = document.getElementById('adminPwd').value.trim();
        if(user === 'lqx666' && pwd === 'lqx888'){
            isAdmin = true;
            localStorage.setItem('adminLoginStatus','ok');
            setAdminShow();
            await loadCloudData();
            alert('管理员登录成功！');
        }else{
            alert('账号或密码错误！');
        }
    })

    //退出
    document.getElementById('logoutBtn').addEventListener('click',()=>{
        localStorage.removeItem('adminLoginStatus');
        isAdmin = false;
        document.getElementById('adminLogin').classList.remove('hide');
        document.getElementById('adminOperBox').classList.add('hide');
        document.getElementById('countBox').classList.add('hide');
        document.getElementById('recordBox').classList.add('hide');
        alert('已退出登录');
    })

    //刷新按钮【修复重点】
    document.getElementById('refreshData').addEventListener('click',loadCloudData);

    //岗位切换
    document.getElementById('postType').addEventListener('change',function(){
        document.getElementById('otherRemarkBox').classList.toggle('hide', this.value !== "其他");
    });
    document.getElementById('clothesSize').addEventListener('change',function(){
        document.getElementById('otherSizeBox').classList.toggle('hide', this.value !== '其他');
    });

    //提交报名
    document.getElementById('submit').addEventListener('click',async ()=>{
        const name = document.getElementById('name').value.trim();
        const gender = document.getElementById('gender').value;
        const phone = document.getElementById('phone').value.trim();
        const school = document.getElementById('school').value.trim();
        const education = document.getElementById('education').value;
        const postType = document.getElementById('postType').value;
        const postRemark = document.getElementById('postRemark').value.trim();
        const trainDate = document.getElementById('trainDate').value;
        const clothesSize = document.getElementById('clothesSize').value;
        const otherSize = document.getElementById('otherSize').value.trim();
        const shoeSize = document.getElementById('shoeSize').value.trim();

        if(!name||!gender||!phone||!school||!education||!postType||!trainDate||!clothesSize||!shoeSize){
            alert('请填写完整信息！'); return;
        }
        if(postType === "其他" && !postRemark){ alert('请填写岗位备注！'); return; }
        if(clothesSize === '其他' && !otherSize){ alert('请填写其他尺码！'); return; }

        const regPhone = /^\d{11}$/;
        if(!regPhone.test(phone)){ alert('手机号必须11位纯数字！'); return; }
        const regChinese = /^[\u4e00-\u9fa5]+$/;
        if(!regChinese.test(school)){ alert('毕业院校只能填中文！'); return; }

        await loadCloudData();
        if(records.some(i => i.name === name && i.phone === phone)){ alert('已报名，禁止重复提交！'); return; }

        const day = countData[trainDate];
        if(day.total >= 90){ alert(trainDate+'总人数已满90人！'); return; }
        if(postType !== "其他" && day[postType] >= postLimit[postType]){
            alert(`${trainDate}${postType}名额已满！`);
            return;
        }

        const newInfo = {name,gender,phone,school,education,postType,postRemark,trainDate,clothesSize,otherSize,shoeSize};
        await saveCloudData(newInfo,trainDate,postType);
        alert('报名成功！');
        document.querySelectorAll('input,select,textarea').forEach(e=>e.value='');
        document.getElementById('otherSizeBox').classList.add('hide');
        document.getElementById('otherRemarkBox').classList.add('hide');
    });

    //导出
    document.getElementById('exportExcel').addEventListener('click',()=>{
        if (!isAdmin) { alert("仅管理员可导出"); return; }
        if (records.length === 0) { alert("暂无数据"); return; }
        let csv = "姓名,性别,手机号,毕业院校,学历,岗位大类,岗位备注,培训日期,穿衣尺码,其他尺码,穿鞋码数\n";
        records.forEach(item => {
            csv += `${item.name},${item.gender},${item.phone},${item.school},${item.education},${item.postType},${item.postRemark||""},${item.trainDate},${item.clothesSize},${item.otherSize || ""},${item.shoeSize}\n`;
        });
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "培训报名名单.csv";
        a.click();
        URL.revokeObjectURL(a.href);
    });
}

//渲染列表
function refresh() {
    if(!isAdmin) return;
    let html = '';
    dates.forEach(d => {
        const item = countData[d];
        html += `<p>${d}：总${item.total}/90 | 机械：${item[Object.keys(postLimit)[0]]}/35 | 电气：${item[Object.keys(postLimit)[1]]}/35 | 视觉：${item[Object.keys(postLimit)[2]]}/10 | 其他不限</p>`;
    });
    document.getElementById('countInfo').innerHTML = html;

    let rhtml = '';
    records.forEach((item, i) => {
        let rem = item.postRemark ? `，备注：${item.postRemark}` : "";
        rhtml += `
        <div class="record-item">
            ${i+1}、${item.name} | ${item.gender} | ${item.phone} | 学历：${item.education}<br>
            院校：${item.school} | 岗位：${item.postType}${rem}<br>
            日期：${item.trainDate} | 衣服：${item.clothesSize} ${item.otherSize||''} | 鞋码：${item.shoeSize}
        </div>`;
    });
    document.getElementById('recordList').innerHTML = rhtml || '<p>暂无报名</p>';
}
</script>
</body>
</html>
