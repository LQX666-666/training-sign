<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>培训报名系统（最终稳定版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2d3748;
        }
        h3 {
            margin-bottom: 15px;
            color: #444;
        }
        .form-box {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: inline-block;
            width: 110px;
            font-weight: bold;
            vertical-align: top;
            padding-top: 8px;
        }
        input, select, textarea {
            width: 340px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: none;
            min-height: 45px;
        }
        button {
            background: #2d8cf0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:disabled{
            background:#999;
            cursor:not-allowed;
        }
        button:hover:not(:disabled) {
            background: #1b74d0;
        }
        .export-btn {
            background: #00b42a;
        }
        .refresh-data-btn{
            background:#ff7d00;
        }
        .logout-btn{
            background:#dc3545;
        }
        .info-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .record-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        .record-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            line-height: 1.6;
        }
        .hide {
            display: none !important;
        }
        .admin-login {
            background: #fce4ec;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .admin-operate{
            margin:15px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>培训报名系统（最终稳定版）</h1>

    <div class="admin-login" id="adminLogin">
        <h3>管理员登录</h3>
        <div class="form-item">
            <label>账号：</label>
            <input type="text" id="adminUser" placeholder="输入管理员账号">
        </div>
        <div class="form-item">
            <label>密码：</label>
            <input type="password" id="adminPwd" placeholder="输入管理员密码">
        </div>
        <button id="loginBtn">登录</button>
    </div>

    <div class="admin-operate hide" id="adminOperBox">
        <button id="refreshData" class="refresh-data-btn">强制刷新最新数据</button>
        <button id="exportExcel" class="export-btn">导出 Excel 报名表</button>
        <button id="logoutBtn" class="logout-btn">退出管理员登录</button>
    </div>

    <div class="form-box">
        <h3>报名信息填写</h3>
        <div class="form-item">
            <label>姓名：</label>
            <input type="text" id="name" placeholder="请输入真实姓名">
        </div>
        <div class="form-item">
            <label>性别：</label>
            <select id="gender">
                <option value="">请选择性别</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-item">
            <label>手机号：</label>
            <input type="tel" id="phone" placeholder="必填11位纯数字手机号" maxlength="11">
        </div>
        <div class="form-item">
            <label>毕业院校：</label>
            <input type="text" id="school" placeholder="仅可填写中文院校名称">
        </div>
        <div class="form-item">
            <label>学历：</label>
            <select id="education">
                <option value="">请选择学历</option>
                <option value="硕士">硕士</option>
                <option value="本科/预备技师">本科/预备技师</option>
                <option value="大专/高技">大专/高技</option>
            </select>
        </div>
        <div class="form-item">
            <label>岗位大类：</label>
            <select id="postType">
                <option value="">请选择岗位大类</option>
                <option value="机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)">机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)</option>
                <option value="电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)">电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)</option>
                <option value="视觉大类(视觉，视觉算法)">视觉大类(视觉，视觉算法)</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-item hide" id="otherRemarkBox">
            <label>岗位备注：</label>
            <textarea id="postRemark" placeholder="自行填写所属岗位信息"></textarea>
        </div>
        <div class="form-item">
            <label>培训日期：</label>
            <select id="trainDate">
                <option value="">请选择培训日期</option>
                <option value="6月25日">6月25日</option>
                <option value="7月2日">7月2日</option>
                <option value="7月9日">7月9日</option>
                <option value="7月16日">7月16日</option>
                <option value="7月23日">7月23日</option>
                <option value="7月30日">7月30日</option>
            </select>
        </div>
        <div class="form-item">
            <label>穿衣尺码：</label>
            <select id="clothesSize">
                <option value="">请选择尺码</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
                <option value="3XL">3XL</option>
                <option value="4XL">4XL</option>
                <option value="其他">其他</option>
            </select>
            <div id="otherSizeBox" class="hide">
                <textarea id="otherSize" placeholder="请填写其他尺码"></textarea>
            </div>
        </div>
        <div class="form-item">
            <label>穿鞋码数：</label>
            <textarea id="shoeSize" placeholder="例：42、38、36等"></textarea>
        </div>
        <button id="submit">提交报名</button>
    </div>

    <div class="info-box hide" id="countBox">
        <h3>实时报名人数</h3>
        <div id="countInfo"></div>
    </div>

    <div class="info-box hide" id="recordBox">
        <h3>已报名名单</h3>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<script>
const BIN_ID = "685d8991ad37e97734cc9178";
const API_KEY = "$2b$10$3ZPuYdFzrO2dN0X0wO9Hvep1LzR6jK0lV8g9jX7xQn8R0lX7yX0y";

const postLimit = {
    "机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)":35,
    "电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)":35,
    "视觉大类(视觉，视觉算法)":10
};
const dates = ["6月25日","7月2日","7月9日","7月16日","7月23日","7月30日"];

let countData = {};
dates.forEach(d => {
    countData[d] = { total:0, ...Object.fromEntries(Object.keys(postLimit).map(k=>[k,0])) };
});

let records = [];
let isAdmin = false;

// 【正确】GET + 随机数强防缓存
function getUrl() {
    return `https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`;
}

async function loadCloudData() {
    const btn = document.getElementById('refreshData');
    if(btn) btn.disabled = true;
    try {
        let res = await fetch(getUrl(), {
            headers: {
                "X-Master-Key": API_KEY,
                "Cache-Control": "no-cache",
                "Pragma": "no-cache"
            },
            cache: "no-store"
        });
        let data = await res.json();
        records = data.record?.records || [];
        countData = data.record?.countData || countData;
        refresh();
        alert("✅ 刷新成功！");
    } catch (e) {
        alert("❌ 刷新失败：网络或接口异常");
        console.error(e);
    } finally {
        if(btn) btn.disabled = false;
    }
}

async function saveCloudData() {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ records, countData })
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    if (localStorage.getItem('adminLoginStatus') === 'ok') {
        isAdmin = true;
        setAdminShow();
    }
    await loadCloudData();
    bindEvent();
});

function setAdminShow() {
    document.getElementById('adminLogin').classList.add('hide');
    document.getElementById('adminOperBox').classList.remove('hide');
    document.getElementById('countBox').classList.remove('hide');
    document.getElementById('recordBox').classList.remove('hide');
}

function bindEvent() {
    document.getElementById('loginBtn').onclick = () => {
        let u = document.getElementById('adminUser').value;
        let p = document.getElementById('adminPwd').value;
        if (u === 'lqx666' && p === 'lqx888') {
            isAdmin = true;
            localStorage.setItem('adminLoginStatus', 'ok');
            setAdminShow();
            alert("登录成功");
        } else alert("账号密码错误");
    };

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.clear();
        location.reload();
    };

    document.getElementById('refreshData').onclick = loadCloudData;

    document.getElementById('postType').onchange = function () {
        document.getElementById('otherRemarkBox').classList.toggle('hide', this.value !== '其他');
    };
    document.getElementById('clothesSize').onchange = function () {
        document.getElementById('otherSizeBox').classList.toggle('hide', this.value !== '其他');
    };

    document.getElementById('submit').onclick = async () => {
        const name = document.getElementById('name').value.trim();
        const gender = document.getElementById('gender').value;
        const phone = document.getElementById('phone').value.trim();
        const school = document.getElementById('school').value.trim();
        const education = document.getElementById('education').value;
        const postType = document.getElementById('postType').value;
        const postRemark = document.getElementById('postRemark').value.trim();
        const trainDate = document.getElementById('trainDate').value;
        const clothesSize = document.getElementById('clothesSize').value;
        const otherSize = document.getElementById('otherSize').value.trim();
        const shoeSize = document.getElementById('shoeSize').value.trim();

        if (!name || !gender || !phone || !school || !education || !postType || !trainDate || !clothesSize || !shoeSize) {
            alert("请填写完整信息"); return;
        }
        if (postType === "其他" && !postRemark) { alert("请填写岗位备注"); return; }
        if (clothesSize === "其他" && !otherSize) { alert("请填写尺码"); return; }

        await loadCloudData();
        if (records.some(i => i.name === name && i.phone === phone)) {
            alert("已报名，请勿重复提交");
            return;
        }

        const day = countData[trainDate];
        if (day.total >= 90) { alert("当天人数已满"); return; }
        if (postType !== "其他" && day[postType] >= postLimit[postType]) {
            alert("该岗位已满"); return;
        }

        records.push({
            name, gender, phone, school, education, postType, postRemark,
            trainDate, clothesSize, otherSize, shoeSize
        });
        day.total++;
        if (postType !== "其他") day[postType]++;

        await saveCloudData();
        alert("报名成功！");
        document.querySelectorAll('input,textarea,select').forEach(i => i.value = '');
    };

    document.getElementById('exportExcel').onclick = () => {
        if (!isAdmin) return;
        let csv = "\uFEFF姓名,性别,手机号,毕业院校,学历,岗位大类,岗位备注,培训日期,穿衣尺码,其他尺码,鞋码\n";
        records.forEach(i => {
            csv += `${i.name},${i.gender},${i.phone},${i.school},${i.education},${i.postType},${i.postRemark || ""},${i.trainDate},${i.clothesSize},${i.otherSize || ""},${i.shoeSize}\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = "报名名单.csv";
        a.click();
    };
}

function refresh() {
    if (!isAdmin) return;
    let countHtml = '';
    dates.forEach(d => {
        let item = countData[d];
        countHtml += `<p>${d}：总${item.total}/90 | 机械${item[Object.keys(postLimit)[0]]}/35 | 电气${item[Object.keys(postLimit)[1]]}/35 | 视觉${item[Object.keys(postLimit)[2]]}/10</p>`;
    });
    document.getElementById('countInfo').innerHTML = countHtml;

    let listHtml = '';
    records.forEach((i, idx) => {
        listHtml += `<div class="record-item">${idx + 1}、${i.name} | ${i.gender} | ${i.phone}<br>院校：${i.school} | 岗位：${i.postType} | 培训：${i.trainDate}<br>衣码：${i.clothesSize} ${i.otherSize || ""} | 鞋码：${i.shoeSize}</div>`;
    });
    document.getElementById('recordList').innerHTML = listHtml || "<p>暂无报名</p>";
}
</script>
</body>
</html>
