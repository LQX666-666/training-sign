<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>培训报名-本地存档版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
body{background:#f5f7fa;padding:20px}
.box{max-width:800px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 12px #eee}
h1{text-align:center;margin-bottom:24px;color:#333}
h3{margin:16px 0;color:#444}
.form-wrap{background:#f8f8f9;padding:22px;border-radius:10px;margin-bottom:25px}
.item{margin-bottom:16px}
label{display:inline-block;width:110px;font-weight:600}
input,select,textarea{width:330px;padding:9px;border:1px solid #ddd;border-radius:5px;font-size:15px}
textarea{min-height:44px;resize:none}
button{padding:10px 22px;border:none;border-radius:5px;color:#fff;font-size:15px;cursor:pointer;margin-right:8px}
.sub{background:#2d8cf0}
.exp{background:#00aa55}
.imp{background:#ff8800}
.logout{background:#dc3545}
.hide{display:none!important}
.admin-box{background:#fef1f3;padding:20px;border-radius:10px;margin-bottom:20px}
.list-box{max-height:360px;overflow-y:auto;padding:10px;border:1px solid #eee;border-radius:8px}
.item-list{padding:10px 0;border-bottom:1px solid #eee;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>培训报名登记表</h1>
<!--管理员登录区-->
<div class="admin-box" id="loginBox">
<h3>管理员后台登录</h3>
<div class="item">
<label>账号：</label><input id="admUser" placeholder="管理员账号">
</div>
<div class="item">
<label>密码：</label><input id="admPwd" type="password" placeholder="管理员密码">
</div>
<button onclick="adminLogin()">登录后台</button>
</div>

<!--管理员操作栏（登录后显示）-->
<div id="adminOper" class="hide">
<button class="exp" onclick="exportData()">导出全部报名JSON</button>
<button class="imp" onclick="document.getElementById('fileIn').click()">导入汇总报名数据</button>
<input type="file" id="fileIn" accept=".json" style="display:none" onchange="importData(this)">
<button class="logout" onclick="logout()">退出</button>
<h3>报名统计：<span id="totalNum">0</span>人</h3>
<div class="list-box" id="recordList"></div>
</div>

<!--报名填写表单-->
<div class="form-wrap">
<h3>填写报名信息</h3>
<div class="item">
<label>姓名：</label><input id="name" placeholder="真实姓名">
</div>
<div class="item">
<label>性别：</label>
<select id="sex">
<option value="">请选择</option>
<option>男</option><option>女</option>
</select>
</div>
<div class="item">
<label>手机号：</label><input id="phone" maxlength="11" placeholder="11位手机号">
</div>
<div class="item">
<label>毕业院校：</label><input id="school">
</div>
<div class="item">
<label>学历：</label>
<select id="edu">
<option value="">选择学历</option>
<option>硕士</option><option>本科/预备技师</option><option>大专/高技</option>
</select>
</div>
<div class="item">
<label>岗位大类：</label>
<select id="post">
<option value="">选择岗位</option>
<option>机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)</option>
<option>电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)</option>
<option>视觉大类(视觉，视觉算法)</option>
<option>其他</option>
</select>
</div>
<div class="item" id="otherPostBox" class="hide">
<label>岗位备注：</label><textarea id="postNote"></textarea>
</div>
<div class="item">
<label>培训日期：</label>
<select id="trainDay">
<option value="">选择日期</option>
<option>6月25日</option><option>7月2日</option><option>7月9日</option>
<option>7月16日</option><option>7月23日</option><option>7月30日</option>
</select>
</div>
<div class="item">
<label>衣服尺码：</label>
<select id="size">
<option value="">尺码</option>
<option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option><option>4XL</option><option>其他</option>
</select>
</div>
<div class="item" id="otherSizeBox" class="hide">
<label>自定义尺码：</label><textarea id="sizeNote"></textarea>
</div>
<div class="item">
<label>鞋码：</label><textarea id="shoe"></textarea>
</div>
<button class="sub" onclick="submitForm()">提交报名</button>
</div>
</div>

<script>
//配置
const ADMIN_ACCOUNT = "lqx666";
const ADMIN_PWD = "lqx888";
const LIMIT = {
    "机械大类(机械设计，机械工艺，机械装调，仿真，器件，激光装调工程师)":35,
    "电气大类(电气设计，电气工艺，PLC程序，电气装调，激光工艺，激光电控)":35,
    "视觉大类(视觉，视觉算法)":10
};
const DAYS = ["6月25日","7月2日","7月9日","7月16日","7月23日","7月30日"];

//读取本地数据
function getLocalData(){
    let d = localStorage.getItem("signupData");
    return d ? JSON.parse(d) : [];
}
function saveLocalData(arr){
    localStorage.setItem("signupData",JSON.stringify(arr));
}

//岗位、尺码下拉联动
document.getElementById("post").onchange=function(){
    document.getElementById("otherPostBox").classList.toggle("hide",this.value!="其他")
}
document.getElementById("size").onchange=function(){
    document.getElementById("otherSizeBox").classList.toggle("hide",this.value!="其他")
}

//提交报名
function submitForm(){
    let name=document.getElementById("name").value.trim();
    let sex=document.getElementById("sex").value;
    let phone=document.getElementById("phone").value.trim();
    let school=document.getElementById("school").value.trim();
    let edu=document.getElementById("edu").value;
    let post=document.getElementById("post").value;
    let postNote=document.getElementById("postNote").value.trim();
    let day=document.getElementById("trainDay").value;
    let size=document.getElementById("size").value;
    let sizeNote=document.getElementById("sizeNote").value.trim();
    let shoe=document.getElementById("shoe").value.trim();

    if(!name||!sex||!phone||!school||!edu||!post||!day||!size||!shoe){
        alert("请完善全部必填信息");return;
    }
    if(post=="其他"&&!postNote){alert("填写岗位备注");return}
    if(size=="其他"&&!sizeNote){alert("填写自定义尺码");return}

    let list = getLocalData();
    //查重
    let repeat = list.find(x=>x.name==name&&x.phone==phone);
    if(repeat){alert("该姓名手机号已报名");return}

    //名额校验
    let dayList = list.filter(x=>x.trainDay==day);
    if(dayList.length>=90){alert("当日名额已满");return}
    if(LIMIT[post]){
        let postNum = dayList.filter(x=>x.post==post).length;
        if(postNum>=LIMIT[post]){alert("该岗位名额已满");return}
    }

    let info = {name,sex,phone,school,edu,post,postNote,trainDay:day,size,sizeNote,shoe};
    list.push(info);
    saveLocalData(list);
    alert("报名提交成功！");
    //清空表单
    document.querySelectorAll("input,select,textarea").forEach(el=>el.value="");
}

//管理员登录
function adminLogin(){
    let u=document.getElementById("admUser").value;
    let p=document.getElementById("admPwd").value;
    if(u==ADMIN_ACCOUNT&&p==ADMIN_PWD){
        document.getElementById("loginBox").classList.add("hide");
        document.getElementById("adminOper").classList.remove("hide");
        renderList();
    }else alert("账号密码错误");
}
//退出登录
function logout(){
    document.getElementById("loginBox").classList.remove("hide");
    document.getElementById("adminOper").classList.add("hide");
}
//渲染名单
function renderList(){
    let list = getLocalData();
    document.getElementById("totalNum").innerText = list.length;
    let html="";
    list.forEach((item,i)=>{
        html += `<div class="item-list">${i+1}.${item.name}｜${item.sex}｜${item.phone}<br>院校:${item.school}｜岗位:${item.post}｜${item.trainDay}<br>衣码:${item.size}${item.sizeNote||""}｜鞋码:${item.shoe}</div>`
    })
    document.getElementById("recordList").innerHTML=html||"<p>暂无报名数据</p>";
}

//导出JSON文件
function exportData(){
    let data = getLocalData();
    let blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="报名汇总.json";
    a.click();
    renderList();
}
//导入JSON汇总
function importData(fileDom){
    let file = fileDom.files[0];
    if(!file)return;
    let fr=new FileReader();
    fr.onload=e=>{
        try{
            let newArr = JSON.parse(e.target.result);
            let oldArr = getLocalData();
            //去重合并
            newArr.forEach(n=>{
                let has = oldArr.find(o=>o.name==n.name&&o.phone==n.phone);
                if(!has) oldArr.push(n);
            })
            saveLocalData(oldArr);
            alert("导入成功，已汇总全部数据");
            renderList();
        }catch(err){
            alert("JSON文件格式错误");
        }
    }
    fr.readAsText(file);
}
</script>
</body>
</html>
